[package]
name = "flyw8t-server"
description = "flyw8t control plane: agent gateway, job orchestration, web console and API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "flyw8t-server"
path = "src/main.rs"

[dependencies]
flyw8t-protocol.workspace = true
flyw8t-domain.workspace = true
flyw8t-web.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ring.workspace = true
base64.workspace = true
hex.workspace = true
rustls.workspace = true
axum.workspace = true
axum-server.workspace = true
sqlx.workspace = true
argon2.workspace = true
form_urlencoded = "1"

# Resource limits for script syntax checkers (script_check.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
flyw8t-agent.workspace = true
flyw8t-helper.workspace = true
tokio-tungstenite.workspace = true
rcgen.workspace = true
tempfile = "3"
proptest = "1"
tower = { version = "0.5", features = ["util"] }
regex-lite = "0.1"
