[package]
name = "flyw8t-windows-media-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

# Development fixture with its own lockfile; excluded from shipping artifacts.
[workspace]

[features]
owned-board = ["windows/Win32_System_RemoteDesktop"]

[[example]]
name = "owned-control"
path = "examples/owned-control/main.rs"
required-features = ["owned-board"]

[dev-dependencies]
hex = "0.4"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
uuid = "1"

[dependencies]
flyw8t-windows-capture-probe = { path = "../windows-capture-probe" }
tempfile = "3"
windows = { version = "=0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }
webrtc = "=0.21.1"
rtc = { version = "=0.21.1", default-features = false }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "io-std", "io-util"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false
