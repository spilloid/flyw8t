[package]
name = "flyw8t-windows-media-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

# Development fixture with its own lockfile; excluded from shipping artifacts.
[workspace]

[dependencies]
tempfile = "3"
windows = { version = "=0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }
webrtc = "=0.21.1"
rtc = { version = "=0.21.1", default-features = false }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "io-std", "io-util"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false
