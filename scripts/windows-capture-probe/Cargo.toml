[package]
name = "flyw8t-windows-capture-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[features]
attended-picker = [
  "windows/Win32_System_RemoteDesktop",
  "windows/Win32_System_StationsAndDesktops",
  "windows/Win32_UI_Accessibility",
  "windows/Win32_UI_Shell",
  "dep:windows-future",
]

[dependencies]
windows-future = { version = "=0.3.2", optional = true }
windows = { version = "=0.62.2", features = [
  "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
  "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.dev]
incremental = false
debug = 0
