name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (agent target) - fmt, clippy, unit tests, model test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  linux:
    name: Linux - PostgreSQL end-to-end, protocol, TLS and UI capture
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: flyw8t
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flyw8t" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FLYW8T_TEST_DATABASE_URL: postgres://flyw8t:ci-only-password@127.0.0.1:5432/postgres
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: rustup show
      - run: cargo clippy --workspace --all-targets --target $TARGET -- -D warnings
      - run: cargo test --workspace --target $TARGET -- --include-ignored --skip console_renders_cleanly_everywhere
      - name: STD-008 UI capture (headless Chrome)
        run: cargo test -p flyw8t-server --test ui_capture --target $TARGET -- --ignored
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-capture
          path: target/ui-capture/
          if-no-files-found: ignore

  image:
    name: Server container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/compose/Dockerfile -t flyw8t-server:ci .
      - name: Compose file is valid
        working-directory: deploy/compose
        run: FLYW8T_DB_PASSWORD=x docker compose config --quiet

  standards:
    name: Company standards (STD-002, STD-003, STD-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PR template has the required sections
        run: |
          f=.github/PULL_REQUEST_TEMPLATE.md
          grep -q '^## What changed' $f && grep -q '^## How it was checked' $f && grep -q '^## Evidence' $f && grep -qi 'synthetic' $f
      - name: README and CHANGELOG state the workspace version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          grep -qF "$v" README.md || { echo "README.md does not mention $v"; exit 1; }
          latest=$(grep -m1 -E '^## .*[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ "$latest" = "$v" ] || { echo "CHANGELOG latest $latest != $v"; exit 1; }
