name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (agent target) - fmt, clippy, unit tests, model test
    runs-on: windows-latest
    env:
      # The runner images have all three parsers: a script syntax check that finds none is a failure here.
      FLYW8T_TEST_REQUIRE_CHECKERS: bash,python,powershell
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build the Windows client and console for desktop integration testing
        run: cargo build --locked -p flyw8t-agent -p flyw8t-technician -p flyw8t-server --target x86_64-pc-windows-msvc
      - name: Registered device link opens the idle technician chooser
        run: ./scripts/test-technician-handoff.ps1 -Binary ./target/x86_64-pc-windows-msvc/debug/flyw8t-technician.exe
      - name: First-use Chrome prompt and three device-page links
        uses: ./.github/actions/check-browser-handoff
        with:
          binaries: target/x86_64-pc-windows-msvc/debug
      - name: Enrolled Windows agent answers the authenticated console through its live socket
        shell: pwsh
        env:
          # The preceding handoff starts this disposable runner's PostgreSQL service.
          FLYW8T_TEST_DATABASE_URL: postgres://postgres:root@127.0.0.1:5432/postgres
        run: |
          $env:FLYW8T_TEST_AGENT_BINARY = (Resolve-Path './target/x86_64-pc-windows-msvc/debug/flyw8t-agent.exe').Path
          cargo test --locked --target x86_64-pc-windows-msvc -p flyw8t-server --test windows_physical_console -- --ignored --nocapture
      - name: Run approved PowerShell against the Windows agent and PostgreSQL
        env:
          FLYW8T_TEST_DATABASE_URL: postgres://postgres:root@127.0.0.1:5432/postgres
        run: cargo test --locked --target x86_64-pc-windows-msvc -p flyw8t-server --test trust --test script_runs -- --include-ignored
      - name: Diagnose cold Windows PowerShell startup (observations only)
        if: always()
        run: ./scripts/diagnose-powershell-startup.ps1
        timeout-minutes: 3

  linux:
    name: Linux - PostgreSQL end-to-end, protocol, TLS and UI capture
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: flyw8t
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flyw8t" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FLYW8T_TEST_DATABASE_URL: postgres://flyw8t:ci-only-password@127.0.0.1:5432/postgres
      TARGET: x86_64-unknown-linux-gnu
      FLYW8T_TEST_REQUIRE_CHECKERS: bash,python,powershell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: rustup show
      - name: Trust vectors match the independent reference encoder (ADR-0015)
        run: python3 -I docs/spec/trust_vectors.py | diff - crates/flyw8t-protocol/tests/vectors/trust.json
      - run: cargo clippy --workspace --all-targets --target $TARGET -- -D warnings
      - name: Build the MCP adapter for the attended browser test
        run: cargo build --locked -p flyw8t-mcp --target $TARGET
      - run: dbus-run-session -- cargo test --workspace --target $TARGET -- --include-ignored --skip console_renders_cleanly_everywhere --nocapture
      - name: STD-008 UI capture (headless Chrome)
        run: dbus-run-session -- cargo test -p flyw8t-server --test ui_capture --target $TARGET -- --ignored
      - name: Consented screenshot through the stdio MCP executable
        env:
          FLYW8T_TEST_SYNTHETIC_CAPTURE: "1"
          FLYW8T_TEST_MCP_BINARY: ${{ github.workspace }}/target/x86_64-unknown-linux-gnu/debug/flyw8t-mcp
        run: dbus-run-session -- cargo test -p flyw8t-server --test support_browser --target $TARGET -- --ignored
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-capture
          path: target/ui-capture/
          if-no-files-found: ignore

  image:
    name: Server container build, sign-in and restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/compose/Dockerfile -t flyw8t-server:ci .
      - name: Compose file is valid
        working-directory: deploy/compose
        run: FLYW8T_DB_PASSWORD=x docker compose config --quiet
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Compose startup, MFA sign-in and restore into an empty database
        run: node scripts/compose-smoke.mjs

  mac-probe:
    name: Mac feasibility probe compiles (no runtime gate)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/mac-feasibility.sh --build-only

  standards:
    name: Company standards (STD-002, STD-003, STD-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PR template has the required sections
        run: |
          f=.github/PULL_REQUEST_TEMPLATE.md
          grep -q '^## What changed' $f && grep -q '^## How it was checked' $f && grep -q '^## Evidence' $f && grep -qi 'synthetic' $f
      - name: README and CHANGELOG state the workspace version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          grep -qF "$v" README.md || { echo "README.md does not mention $v"; exit 1; }
          latest=$(grep -m1 -E '^## .*[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ "$latest" = "$v" ] || { echo "CHANGELOG latest $latest != $v"; exit 1; }
