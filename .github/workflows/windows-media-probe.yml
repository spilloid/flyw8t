name: Windows media probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/windows-media-probe/**'
      - 'scripts/windows-capture-probe/**'
      - '.github/workflows/windows-media-probe.yml'
      - '.cargo/config.toml'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  synthetic-h264:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/windows-media-probe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path ../windows-capture-probe/Cargo.toml --check
      - run: rustc -Vv
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --locked
      - run: npm ci --ignore-scripts
      - run: node browser.mjs ./target/x86_64-pc-windows-msvc/debug/flyw8t-windows-media-probe.exe
      - run: node loopback.mjs ./target/x86_64-pc-windows-msvc/debug/flyw8t-windows-media-probe.exe
      - run: node loopback.mjs ./target/x86_64-pc-windows-msvc/debug/flyw8t-windows-media-probe.exe --owned-window --refusal-only
      - run: node owned-control-check.mjs
