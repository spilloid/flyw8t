name: release

# A pushed tag `vX.Y.Z` builds the server, agent, MCP adapter and script signer for Windows and Linux,
# including the native technician app on Windows, and publishes them
# with SHA-256 sums, as a GitHub pre-release whose notes are that version's CHANGELOG section.
# It also pushes the server image to ghcr.io/<owner>/flyw8t-server:X.Y.Z (unsigned; the release
# notes carry its digest).
# Windows binaries are Authenticode-signed with Azure Artifact Signing and verified before
# anything is uploaded (`.github/actions/sign-release`); a release cannot publish unsigned
# Windows binaries. Linux binaries are covered by SHA256SUMS only.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # The `release` environment holds the signing identity; only this workflow and the signing
    # check may use it.
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo build --release --locked --target ${{ matrix.target }} -p flyw8t-server -p flyw8t-agent -p flyw8t-mcp -p flyw8t-sign
      - name: Build the native Windows technician client
        if: matrix.os == 'windows-latest'
        run: cargo build --release --locked --target ${{ matrix.target }} -p flyw8t-technician
      - name: Collect binaries
        shell: bash
        run: |
          mkdir dist
          binaries=(flyw8t-server flyw8t-agent flyw8t-mcp flyw8t-sign)
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            binaries+=(flyw8t-technician)
          fi
          for b in "${binaries[@]}"; do
            cp "target/${{ matrix.target }}/release/$b${{ matrix.ext }}" "dist/$b-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.ext }}"
          done
      - name: Sign and verify Windows binaries
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/sign-release
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          account: ${{ vars.SIGNING_ACCOUNT }}
          profile: ${{ vars.SIGNING_PROFILE }}
          expected-subject: ${{ vars.SIGNING_EXPECTED_SUBJECT }}
      - name: Verify the agent version matches the release tag
        shell: bash
        run: |
          agent="dist/flyw8t-agent-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.ext }}"
          got=$("$agent" --version | tr -d '\r')
          test "$got" = "flyw8t-agent ${GITHUB_REF_NAME#v}" || { echo "Agent reports '$got', tag is ${GITHUB_REF_NAME}."; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.target }}
          path: dist/

  image:
    # The image CI builds and signs in to on every pull request (ci.yml, job `image`), pushed
    # under the version alone: no `latest`, so a deployment always names what it runs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          docker build -f deploy/compose/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/flyw8t-server:${GITHUB_REF_NAME#v}" .
      - name: The image starts and reports its version
        run: |
          # The whole line must match: 0.1.20 is not 0.1.2.
          got=$(docker run --rm "ghcr.io/${GITHUB_REPOSITORY_OWNER}/flyw8t-server:${GITHUB_REF_NAME#v}" --version)
          test "$got" = "flyw8t-server ${GITHUB_REF_NAME#v}" || { echo "image reports '$got', tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/flyw8t-server:${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          case "$ref" in *@sha256:*) ;; *) echo "no digest for $image"; exit 1 ;; esac
          echo "ref=${image}@${ref#*@}" >> "$GITHUB_OUTPUT"
          echo "Pushed \`${image}@${ref#*@}\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          printf '\n### Server image\n`%s` (unsigned; pin the digest)\n' "$IMAGE_REF" >> notes.md
        env:
          IMAGE_REF: ${{ needs.image.outputs.ref }}
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --verify-tag --title "flyw8t $GITHUB_REF_NAME (pre-release)" --notes-file notes.md
