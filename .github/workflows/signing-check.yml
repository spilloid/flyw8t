name: Signing check

# Proves code signing works end to end without publishing anything: builds the Windows release
# binaries, signs them through the same composite action the release uses, and verifies the
# result. Run it after configuring signing and before tagging a release. The signed binaries
# are kept as a private artifact for one day.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    name: Sign and verify (no release)
    runs-on: windows-latest
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc -p flyw8t-server -p flyw8t-agent -p flyw8t-mcp -p flyw8t-sign -p flyw8t-technician
      - name: Collect binaries
        shell: bash
        run: |
          mkdir dist
          for binary in flyw8t-server flyw8t-agent flyw8t-mcp flyw8t-sign flyw8t-technician; do
            cp "target/x86_64-pc-windows-msvc/release/$binary.exe" dist/
          done
      - name: Sign and verify binaries
        uses: ./.github/actions/sign-release
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          account: ${{ vars.SIGNING_ACCOUNT }}
          profile: ${{ vars.SIGNING_PROFILE }}
          expected-subject: ${{ vars.SIGNING_EXPECTED_SUBJECT }}
      - uses: actions/upload-artifact@v5
        with:
          name: signed-binaries
          path: dist/*.exe
          retention-days: 1

  browser-launch:
    name: Signed Windows browser handoff on a clean user
    needs: sign
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: signed-binaries
          path: dist
      - name: Verify the downloaded signed executables
        shell: pwsh
        run: |
          $expected = 'flyw8t-agent.exe', 'flyw8t-mcp.exe', 'flyw8t-server.exe', 'flyw8t-sign.exe', 'flyw8t-technician.exe'
          $files = Get-ChildItem dist -File
          if (Compare-Object $expected $files.Name) { throw 'Unexpected signed artifact contents.' }
          ./scripts/verify-signature.ps1 -Files $files.FullName -ExpectedSubject 'CN=Joseph Spillers'
      - name: Verify signed agent enrollment and the Windows browser handoff
        uses: ./.github/actions/check-browser-handoff
        env:
          FLYW8T_TEST_SIGNED_TRIAL_INSTALL: '1'
        with:
          binaries: dist
